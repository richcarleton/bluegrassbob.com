<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bluegrassbob.com</title>
<style>
  :root {
    --bg: #2b2016;
    --bg2: #3d2f1f;
    --text: #f0e4cf;
    --accent: #c98a3c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    background: radial-gradient(circle at 50% 30%, var(--bg2), var(--bg));
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  main {
    text-align: center;
  }
  h1 {
    font-size: clamp(2rem, 8vw, 4.5rem);
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--accent);
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }
  p {
    margin-top: 1rem;
    font-size: 1.1rem;
    opacity: 0.8;
  }
</style>
</head>
<body>
<main>
  <h1>bluegrassbob.com</h1>
  <p>Coming soon.</p>
</main>
</body>
</html>
